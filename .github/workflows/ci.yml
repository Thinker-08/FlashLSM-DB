name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.23.x", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        if: matrix.go == '1.23.x'
        run: go run honnef.co/go/tools/cmd/staticcheck@2024.1.1 ./...
